
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBound AI - Professional Travel Planner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: #1a202c;
            scroll-behavior: smooth;
        }

        .trip-gradient {
            background: #0f172a;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        h1, h2, h3, h4, h5, .font-black {
            letter-spacing: -0.05em;
        }

        .serif-italic {
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
          width: 6px;
        }
        ::-webkit-scrollbar-track {
          background: #f8fafc;
        }
        ::-webkit-scrollbar-thumb {
          background: #e2e8f0;
          border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #cbd5e1;
        }

        @media print {
            .no-print { display: none !important; }
            .screen-only { display: none !important; }
            body { background: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .print-only { display: block !important; }
            .rounded-\[40px\], .rounded-\[60px\], .rounded-\[48px\] { border-radius: 8px !important; }
            .shadow-\[0_40px_80px_-15px_rgba\(0,0,0,0.3\)\], .shadow-2xl, .shadow-xl { box-shadow: none !important; }
            @page { size: A4; margin: 12mm 10mm; }
        }

        @media screen {
            .print-only { display: none !important; }
        }

        @keyframes fadeInSlideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-wow {
            animation: fadeInSlideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        input, select, textarea {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
<script type="importmap">

</html>
